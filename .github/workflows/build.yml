name: Build NRO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libs
        run: |
          PKGS="switch-tools libnx switch-curl switch-libarchive switch-mbedtls switch-zlib switch-pkg-config switch-sdl2 switch-sdl2_ttf switch-freetype"
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm --needed $PKGS && exit 0
            echo "retry $i"
            sleep $((i*20))
          done
          echo "sync failed, trying cached database"
          dkp-pacman -S --noconfirm --needed $PKGS
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: Save_WebDAV
          path: Save_WebDAV.nro
